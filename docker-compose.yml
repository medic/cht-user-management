# The app and its Redis. Settings come from .env (see .env.example):
#
#   docker compose up -d --build
#
# Compose sets what must differ inside the containers: where Redis is, and the port the app listens on.
# DEPLOYMENT_DIR names the deployment's folder, and with it the instances; config/deployments/ is in
# the image. To offer a local CHT from CHT_DEV_INSTANCE, which production ignores:
#   NODE_ENV=development docker compose up -d
services:
  app:
    build: .
    image: cht-user-management
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # archives of deleted and merged docs, which undo needs
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # staged lists, sessions, credentials and jobs live here: keep them on disk
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  redis-data:
