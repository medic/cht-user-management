# CHT User Management for chis-tg, with Medic's cht-user-management chart. See ../README.md
cht-user-management:
  # one server: the archives of deleted and merged places are on its volume, for undo
  replicaCount: 1
  service:
    port: 3000
    enabled: true
  image:
    repository: public.ecr.aws/medic/cht-user-management

  env:
    NODE_ENV: production
    REDIS_URL: redis://users-chis-tg-redis-master.users-chis-prod.svc.cluster.local:6379
    # the deployment folder in the image: contact types, CHT instances, logo
    DEPLOYMENT_DIR: config/deployments/chis-tg
  envSecrets:
    # COOKIE/WORKER_PRIVATE_KEY are generated by the chart if they don't exist. SECRET_KEY must be
    # 64 hex characters (openssl rand -hex 32); see ../README.md
    - env: COOKIE_PRIVATE_KEY
      secretName: '{{ .Release.Name }}-cht-user-management'
    - env: WORKER_PRIVATE_KEY
      secretName: '{{ .Release.Name }}-cht-user-management'
    - env: SECRET_KEY
      secretName: '{{ .Release.Name }}-cht-user-management'

  # move, merge and delete jobs run cht-conf in the same container, with up to 2 GB of heap
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 3Gi

  # the app runs as user node (1000): this lets it write to the volume
  podSecurityContext:
    fsGroup: 1000
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: users-chis-tg-data
  volumeMounts:
    - name: data
      mountPath: /app/data

  # EKS prod ELB
  ingress:
    enabled: true
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/tags: Environment=prod,Team=SRE
      alb.ingress.kubernetes.io/group.name: prod-cht-alb
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-port: traffic-port
      alb.ingress.kubernetes.io/healthcheck-path: /_healthz
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:iam::720541322708:server-certificate/2024-wildcard-app-medicmobile-org-chain
    className: alb
    hosts:
      - host: users-chis-tg.app.medicmobile.org
        paths:
          - path: /
            pathType: Prefix

# The worker is part of the app now; the chart still includes it, so it's scaled to nothing
cht-user-management-worker:
  replicaCount: 0
  service:
    enabled: false
  image:
    repository: public.ecr.aws/medic/cht-user-management

redis:
  architecture: standalone
  replica:
    replicaCount: 1
  persistence:
    enabled: true
    storageClass: ebs-gp2
    size: 8Gi
  auth:
    enabled: false
  image:
    repository: bitnamilegacy/redis
    tag: '8.2.1-debian-12-r0'
